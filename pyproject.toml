[build-system]
requires = ["setuptools==80.9.0"]
build-backend = "setuptools.build_meta"

[project]
name = "ai-quality-evals"
version = "0.2.0"
description = "Deterministic retrieval and offline trace evaluation for a synthetic benefits knowledge base"
readme = "README.md"
requires-python = ">=3.13"
license = "MIT"
authors = [{ name = "rmpetrov" }]
dependencies = []
classifiers = [
    "Programming Language :: Python :: 3.13",
    "Topic :: Software Development :: Testing",
]

[project.optional-dependencies]
live = ["openai==3.29.0"]
dev = ["pytest==8.4.2", "ruff==0.13.3", "mypy==1.18.2"]

[project.scripts]
ai-evals = "ai_quality_evals.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
ai_quality_evals = ["py.typed", "data/*.jsonl", "data/kb/*.md", "data/replays/*.jsonl"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra --strict-config --strict-markers"
filterwarnings = ["error"]

[tool.ruff]
target-version = "py313"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]

[tool.mypy]
python_version = "3.13"
strict = true
files = ["src", "tests", "scripts"]
warn_unreachable = true
