name: Offline evaluation quality

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  quality:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      PYTHONHASHSEED: "0"
      PIP_DISABLE_PIP_VERSION_CHECK: "1"
    steps:
      - uses: actions/checkout@08c6903cd8c0fde910a37f88322edcfb5dd907a8 # v5.0.0
        with:
          persist-credentials: false
      - uses: actions/setup-python@e797f83bcb11b83ae66e0230d6156d7c80228e7c # v6.0.0
        with:
          python-version: "3.13"
      - name: Clean pinned installation
        run: |
          python -m pip install --no-cache-dir -r requirements-dev.lock
          python -m pip install --no-cache-dir --no-build-isolation --no-deps .
          python -m pip check
      - name: Formatting and lint
        run: |
          ruff format --check .
          ruff check .
      - name: Strict static typing
        run: mypy
      - name: Evaluator and dataset tests
        run: python -m pytest -q
      - name: Deterministic offline evaluation and expected failures
        run: python scripts/check_offline.py
      - name: V2 captured replay and CLI failure paths
        run: python scripts/check_captures_offline.py
      - name: Upload diagnostic reports
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: offline-evaluation-reports
          # Explicit allowlist: actual live captures/reports are never CI artifacts.
          path: |
            reports/retrieval.json
            reports/retrieval-repeat.json
            reports/replay-good.json
            reports/replay-bad.json
            reports/replay-observation.json
            reports/retrieval-k1.json
            reports/captured-format-simulated.json
          if-no-files-found: warn
          retention-days: 14

  sdk-contract:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      PYTHONHASHSEED: "0"
      PIP_DISABLE_PIP_VERSION_CHECK: "1"
    steps:
      - uses: actions/checkout@08c6903cd8c0fde910a37f88322edcfb5dd907a8 # v5.0.0
        with:
          persist-credentials: false
      - uses: actions/setup-python@e797f83bcb11b83ae66e0230d6156d7c80228e7c # v6.0.0
        with:
          python-version: "3.13"
      - name: Pinned optional SDK and local package installation
        run: |
          python -m pip install --no-cache-dir -r requirements-live.lock
          python -m pip install --no-cache-dir .
          python -m pip check
      - name: Offline official OpenAI SDK contract
        # The script uses a dummy credential, local MockTransport, and blocked sockets.
        run: python scripts/check_sdk_offline.py
